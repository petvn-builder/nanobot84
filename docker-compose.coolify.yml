services:
  nanobot-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint:
      - /bin/sh
      - -c
      - |
        python /app/scripts/render_config.py
        exec /usr/local/bin/entrypoint.sh gateway
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      NANOBOT_WEB_TOKEN: ${NANOBOT_WEB_TOKEN}
      NANOBOT_MODEL: ${NANOBOT_MODEL}
    volumes:
      - nanobot_data:/home/nanobot/.nanobot
    ports:
      - "8765:8765"
      - "18790:18790"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18790/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined

volumes:
  nanobot_data:
