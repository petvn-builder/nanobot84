services:
  nanobot-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint:
      - /bin/sh
      - -c
      - |
        python /app/scripts/render_config.py --template /app/config.coolify.json
        exec /usr/local/bin/entrypoint.sh gateway
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_ALLOW_FROM: ${TELEGRAM_ALLOW_FROM}
      NANOBOT_PROVIDER: ${NANOBOT_PROVIDER}
      NANOBOT_9ROUTER_BASE_URL: ${NANOBOT_9ROUTER_BASE_URL}
      NANOBOT_9ROUTER_API_KEY: ${NANOBOT_9ROUTER_API_KEY}
      NANOBOT_9ROUTER_MODEL: ${NANOBOT_9ROUTER_MODEL}
      NANOBOT_WEB_TOKEN: ${NANOBOT_WEB_TOKEN}
    volumes:
      - nanobot_data:/home/nanobot/.nanobot
      - /home/opc/coolify/exports/nanobot:/home/nanobot/exports
      - /home/opc/docker/nanobot/workspace/projects/licham.blog:/home/nanobot/.nanobot/workspace/projects/licham.blog
    ports:
      - "8765:8765"
      - "18790:18790"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18790/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined

volumes:
  nanobot_data:
