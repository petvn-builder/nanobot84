x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ~/.nanobot:/home/nanobot/.nanobot
    - /home/opc/docker/nanobot/workspace/projects/licham.blog:/home/nanobot/.nanobot/workspace/projects/licham.blog
  entrypoint:
    - /bin/sh
    - -c
    - |
      python /app/scripts/render_config.py
      exec /usr/local/bin/entrypoint.sh "$$@"
    - nanobot-entrypoint
  environment:
    NANOBOT_PROVIDER: ${NANOBOT_PROVIDER}
    NANOBOT_9ROUTER_BASE_URL: ${NANOBOT_9ROUTER_BASE_URL}
    NANOBOT_9ROUTER_API_KEY: ${NANOBOT_9ROUTER_API_KEY}
    NANOBOT_9ROUTER_MODEL: ${NANOBOT_9ROUTER_MODEL}
    NANOBOT_WEB_TOKEN: ${NANOBOT_WEB_TOKEN}
  cap_drop:
    - ALL
  cap_add:
    - SYS_ADMIN
  security_opt:
    - apparmor=unconfined
    - seccomp=unconfined

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 18790:18790
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-api:
    container_name: nanobot-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanobot/.nanobot/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
